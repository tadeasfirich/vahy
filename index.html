<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rovnice na vahách</title>
<style>
:root{
  --k:#2A4B9B; --t:#14171f; --m:#5a6172; --l:#b9c0ce; --b:#eef1f7; --p:#ffffff; --n:#9fb2e8;
  --pismo:"Carlito","Calibri","DejaVu Sans",system-ui,sans-serif;
  --mono:"DejaVu Sans Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:17px/1.45 var(--pismo);color:var(--t);background:var(--p);text-align:left}
p{margin:0}
[hidden]{display:none !important}
#app{display:flex;flex-direction:column;height:100vh;min-height:100%;max-width:1560px;margin:0 auto;padding:8px 20px 10px}

/* ---------- záhlaví ---------- */
.zahlavi{display:flex;align-items:flex-end;gap:6px 18px;flex-wrap:wrap;border-bottom:2.5px solid var(--t);padding-bottom:5px}
.popisek{font:700 11.5px/1.2 var(--mono);letter-spacing:.14em;color:var(--k);text-transform:uppercase;margin-bottom:1px}
h1{font-size:23px;line-height:1.15;margin:0;font-weight:700}
.etapy{display:flex;gap:0;margin-left:auto;align-items:center}
.etapy button{width:44px;min-height:44px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.etapy button span{width:30px;height:30px;border-radius:50%;border:1px solid var(--t);display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--mono);background:var(--p);color:var(--t)}
.etapy button.hotova span{background:var(--t);color:var(--p)}
.etapy button.nyni span{background:var(--k);border-color:var(--k);color:var(--p);box-shadow:0 0 0 2px var(--p),0 0 0 3.5px var(--k)}
.etapy button.rozs span{border-style:dashed}
.etapy button.rozs.hotova span,.etapy button.rozs.nyni span{border-style:solid}
.etapy button:disabled span{border-color:var(--l);color:var(--m)}
.etapy .delic{width:1px;height:26px;background:var(--l);margin:0 3px}
.rezim{display:flex;gap:10px;list-style:none;margin:0;padding:0 0 9px;font:700 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--m)}
.rezim li{display:flex;align-items:center;gap:5px}
.rezim i{width:12px;height:12px;border:1px solid var(--m);display:block}
.rezim li.on{color:var(--t)}
.rezim li.on i{background:var(--k);border-color:var(--k)}
.odkazy{display:flex;gap:8px;padding-bottom:1px}
.etapy[hidden] ~ .odkazy{margin-left:auto}

/* ---------- tlačítka a vstupy ---------- */
button{font:inherit;color:var(--t);cursor:pointer}
.tl{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--t);border-radius:2px;background:var(--p);line-height:1.2}
.tl.maly{padding:0 10px}
.tl.hlavni{background:var(--k);border-color:var(--k);color:var(--p);font-weight:700}
.tl[aria-pressed="true"]{background:var(--t);color:var(--p)}
.tl:disabled{border-color:var(--l);color:var(--m);cursor:default;background:var(--p)}
.tl.tichy{border-color:var(--l)}
:focus-visible{outline:2.5px solid var(--k);outline-offset:2px}
input[type=text],textarea{font:20px/1.3 var(--mono);color:var(--t);border:1px solid var(--t);border-radius:2px;background:var(--p);min-height:44px;padding:4px 8px}
textarea{font:17px/1.45 var(--pismo);width:100%;resize:vertical;min-height:70px}
input.kratky{width:86px;text-align:center}
label.zatrh{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding-right:6px}
label.zatrh input{width:20px;height:20px;accent-color:var(--k)}

/* ---------- pohledy ---------- */
#obsah{flex:1;min-height:0;display:flex;flex-direction:column}
.pohled{flex:1;min-height:0}
.box{border:1px solid var(--l);border-radius:2px;background:var(--b);padding:10px 14px}
.tmavy{background:var(--t);color:var(--p);border:1px solid var(--t);border-radius:2px;padding:16px 20px}
.tmavy h2{color:var(--n);font:700 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
.tmavy .tl{border-color:var(--p)}
.tmavy .tl.hlavni{background:var(--p);color:var(--t);border-color:var(--p)}
.nadpisek{font:700 11.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--k);margin-bottom:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.uvod{display:flex;align-items:center;justify-content:center}
.uvod .tmavy{max-width:560px;width:100%}
.uvod .velke{font-size:26px;line-height:1.25;font-weight:700;margin-bottom:8px}
.uvod .rada{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ---------- pracovní plocha ---------- */
.plocha{display:grid;gap:8px 16px;padding-top:8px;
  grid-template-columns:minmax(0,1.62fr) minmax(310px,1fr);
  grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"ukol zapisnik" "vahy zapisnik" "vahy pruvodce" "ovladani pruvodce"}
.ukol{grid-area:ukol;min-height:92px}
.vahyBox{grid-area:vahy;min-height:150px;display:flex;flex-direction:column;position:relative}
.ovladani{grid-area:ovladani}
.zapisnik{grid-area:zapisnik;min-height:0;overflow:auto;background:var(--p)}
.pruvodce{grid-area:pruvodce;min-height:132px}
.plocha.bezvah{grid-template-rows:auto minmax(0,1fr);grid-template-areas:"ukol pruvodce" "zapisnik pruvodce"}
.plocha.bezvah .vahyBox,.plocha.bezvah .ovladani{display:none}
.plocha.bezvah .pruvodce{align-self:start}
.plocha.volne .pruvodce{display:none}
.plocha.volne{grid-template-areas:"ukol zapisnik" "vahy zapisnik" "vahy zapisnik" "ovladani zapisnik"}

.ukol .zadani{max-width:62ch}
.ukol .rada{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ukol .rada .stitekPole{font:15px/1.2 var(--mono);color:var(--m)}
.ukol .vysledek{margin-top:8px;font-weight:700}
.ukol.tmavyUkol{background:var(--t);border-color:var(--t);color:var(--p)}
.ukol.tmavyUkol .nadpisek{color:var(--n)}
.ukol.tmavyUkol .tl{border-color:var(--p)}
.ukol.tmavyUkol .tl.hlavni{background:var(--p);color:var(--t)}
.poznamka{font-size:15px;color:var(--m);margin-top:6px}
.serie{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.serie i{width:12px;height:12px;border:1px solid var(--t);display:block}
.serie i.on{background:var(--t)}
.ucitelBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--l)}

.vahy{flex:1;min-height:0;width:100%;display:block;user-select:none;-webkit-user-select:none}
.stitek{position:absolute;left:0;top:0;font:700 11.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--k);background:var(--p);padding:2px 6px 2px 0}
.stavVah{font:15px/1.3 var(--mono);color:var(--m);min-height:20px;margin-left:auto;text-align:right}
.radek1{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:baseline;margin-bottom:5px}
.hodnotaX{font:700 20px var(--mono);min-width:22px;text-align:center}
.stitekPole{font:15px/1.2 var(--mono);color:var(--m)}
.rameno{stroke:var(--t);stroke-width:3.5;stroke-linecap:round}
.rameno.zadni{stroke-width:2.5;stroke-dasharray:9 6}
.stojan{stroke:var(--t);stroke-width:1.5;fill:var(--p);stroke-linejoin:round}
.podpera{stroke:var(--m);stroke-width:1.5}
.cep{fill:var(--t)}
.hacek,.lanko{stroke:var(--m);stroke-width:1.2}
.cislo{font:700 13px var(--mono);fill:var(--m);text-anchor:middle}
.zav{cursor:grab;touch-action:none}
.zav circle,.zav polygon,.zav rect{fill:var(--p);stroke:var(--t);stroke-width:1.8;stroke-linejoin:round}
.zav text{font:700 13.5px var(--mono);fill:var(--t);text-anchor:middle;pointer-events:none}
.zav-L rect{fill:var(--k);stroke:var(--k)}
.zav-L text{fill:var(--p)}
.zav.vybrane circle,.zav.vybrane polygon,.zav.vybrane rect{stroke:var(--k);stroke-width:4}
.zav-L.vybrane rect{stroke:var(--t)}
.zav.duch{cursor:default}
.zav.duch circle,.zav.duch polygon,.zav.duch rect{fill:none;stroke:var(--m);stroke-width:1.4;stroke-dasharray:3 3}
.zav.duch text{fill:var(--m)}
.pevne .zav{cursor:default}
.zona{fill:var(--p);fill-opacity:0;stroke:none}
.kolik{cursor:pointer;outline:none}
.kolik:focus-visible .zona{stroke:var(--k);stroke-width:2.5}
.kolik.cil .zona{fill:var(--b);fill-opacity:1}
.ucinekText{font:700 15px var(--mono);fill:var(--t);text-anchor:middle}

.ovladani .pocitadlo{font:700 16px/1.3 var(--mono);min-height:22px}
.ovladani .rada{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.zasobnik{display:flex;gap:6px;padding-right:10px;margin-right:2px;border-right:1px solid var(--l)}
.zasobnik .tl{padding:0;width:48px;height:48px;touch-action:none}
.zasobnik svg{width:38px;height:38px;display:block;margin:auto;pointer-events:none}
.zasobnik .tl[aria-pressed="true"]{background:var(--b);box-shadow:inset 0 0 0 2.5px var(--k);border-color:var(--k)}
#duch{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;display:none;z-index:9}
#duch svg{width:44px;height:44px}

.radky{list-style:none;margin:0;padding:0}
.radky li{font:20px/1.35 var(--mono);padding:5px 0;border-bottom:1px solid var(--b);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.radky .upr{color:var(--k);white-space:nowrap}
.radky li.zk{color:var(--m);font-size:17px}
.novy{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.vstupRadek{flex:1;min-width:150px;width:100%}
.vstupUpr{width:104px}
.reseni{margin-top:10px;padding-top:8px;border-top:1px dashed var(--m);font:15px/1.5 var(--mono);color:var(--m)}

.pruvodce{border:1px solid var(--l);border-radius:2px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.otazka{border-left:2.5px solid var(--k);padding-left:12px;font-style:italic;max-width:56ch}
.volby{display:flex;gap:8px;flex-wrap:wrap}
.volby .tl{font-family:var(--mono)}
.nabidka{color:var(--m);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pruvodce .dole{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- závěr a o aplikaci ---------- */
.zaver,.oapl,.export{overflow:auto;padding:12px 0}
.zaver .obal,.oapl .obal,.export .obal{max-width:860px;display:grid;gap:12px}
.export input[type=text]{font:20px/1.3 var(--pismo);width:100%;max-width:420px;display:block;margin-top:6px}
.skala{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.skala .tl{font:700 18px var(--mono);padding:0;width:48px}
.export a.tl{display:inline-flex;align-items:center;text-decoration:none;color:var(--t)}
.rada{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.naSirku{display:none;font-size:15px;color:var(--m);padding:6px 0 0}
.prehled{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
.prehled li{display:flex;gap:10px;align-items:center;padding:4px 0;break-inside:avoid;border-bottom:1px solid var(--b)}
.prehled .zn{width:16px;height:16px;border:1.5px solid var(--t);flex:none}
.prehled .zn.sam{background:var(--t)}
.prehled .zn.otazky,.prehled .zn.opora{background:linear-gradient(90deg,var(--t) 50%,var(--p) 50%)}
.prehled .st{margin-left:auto;font:14px var(--mono);color:var(--m);text-align:right}
.oapl p{max-width:66ch}
h2{font-size:20px;margin:0;line-height:1.25}

@media (max-width:980px){
  #app{height:auto;padding:8px 12px 16px}
  .etapy{margin-left:0;flex-wrap:wrap}
  .plocha,.plocha.bezvah,.plocha.volne{display:flex;flex-direction:column}
  .ukol{order:1}.ovladani{order:2}.vahyBox{order:3}.pruvodce{order:4}.zapisnik{order:5;max-height:none}
  .vahy{flex:none;height:auto;min-height:120px;max-height:calc(100vh - 118px)}
  .prehled{columns:1}
}
@media (max-width:600px) and (orientation:portrait){.naSirku{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="app">
  <header class="zahlavi">
    <div class="znacka">
      <p class="popisek">MATEMATIKA · 9. ROČNÍK · ROVNICE</p>
      <h1>Rovnice na vahách</h1>
    </div>
    <nav class="etapy" id="etapy" aria-label="Etapy"></nav>
    <ul class="rezim" id="rezim" aria-label="Režim opory"></ul>
    <div class="odkazy" id="odkazy"></div>
  </header>
  <main id="obsah">
    <p class="naSirku">Na telefonu otoč displej na šířku. Váhy budou větší.</p>
    <section id="uvod" class="pohled uvod" hidden></section>
    <section id="plocha" class="pohled plocha" hidden>
      <div id="ukol" class="box ukol"></div>
      <div id="vahyBox" class="vahyBox">
        <p id="stitek" class="stitek" hidden></p>
        <svg id="vahy" class="vahy" role="group" aria-label="Váhy" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="ovladani" class="ovladani">
        <div class="radek1"><p class="pocitadlo" id="pocitadlo"></p><p id="stavVah" class="stavVah" aria-live="polite"></p></div>
        <div class="rada" id="ovlRada"></div>
      </div>
      <section id="zapisnik" class="box zapisnik" aria-label="Zápisník"></section>
      <section id="pruvodce" class="pruvodce" aria-label="Průvodce">
        <p class="nadpisek">Průvodce</p>
        <div id="rec" aria-live="polite"></div>
        <div id="recVolby"></div>
        <div id="recDole" class="dole"></div>
      </section>
    </section>
    <section id="zaver" class="pohled zaver" hidden></section>
    <section id="oapl" class="pohled oapl" hidden></section>
    <section id="export" class="pohled export" hidden></section>
  </main>
</div>
<div id="duch" aria-hidden="true"></div>
<script>
(function () {
'use strict';

/* =====================================================================
   KONFIGURACE
   ===================================================================== */
var KONF = {
  verze: 1,
  klic: 'rovnice-na-vahach-v1',   // klíč v localStorage (obsahuje verzi)
  oddelovac: '|',                 // znak před úpravou; jde změnit na '/'
  maxPozice: 5,                   // kolíky 1 až 5
  maxNaKoliku: 5,                 // nejvýš 5 závaží pod sebou
  hmotnosti: { d: 1, t: 3, h: 6 },// disk ; trojúhelník ; šestiúhelník
  uhel: 7,                        // náklon puštěných vah ve stupních
  uhelZapor: 4,                   // menší náklon, když je vidět i záporné rameno
  animace: 450,                   // délka náklonu v ms
  necinnost: 75000,               // po kolika ms nečinnosti se průvodce nabídne
  pauza: 90000,                   // delší mezera mezi akcemi se do času práce nepočítá
  exportCas: true,                // má být v PDF čas práce (v aplikaci se čas neukazuje)
  barvy: { k: '#2A4B9B', t: '#14171f', m: '#5a6172', l: '#b9c0ce', b: '#eef1f7', p: '#ffffff', n: '#9fb2e8' },
  maxDvojcat: 2,                  // nejvýš dvě dvojčata, pak postup „s oporou“
  e2Serie: 3,                     // tolik správných tipů po sobě ukončí E2
  e2Max: 8                        // po tolika vahách E2 skončí vždy
};

/* =====================================================================
   DATA: etapy, úlohy, texty průvodce
   Učitel může upravovat ručně. Závaží: d disk (1) ; t trojúhelník (3) ;
   h šestiúhelník (6) ; L záhadné závaží. p = pozice, n = počet.
   ===================================================================== */
var ETAPY = [
  { id: 'e1',  nazev: 'Háček: ověř svůj tip' },
  { id: 'e2',  nazev: 'Účinek' },
  { id: 'e3',  nazev: 'Stejně na obě strany' },
  { id: 'e4',  nazev: 'Kolik váží L' },
  { id: 'e5',  nazev: 'L na obou stranách' },
  { id: 'e6',  nazev: 'Od vah k zápisu' },
  { id: 'e7',  nazev: 'Záporné pozice',   rozsireni: true, obtiznost: 'střední' },
  { id: 'e8',  nazev: 'Závorka na háčku', rozsireni: true, obtiznost: 'střední' },
  { id: 'e9',  nazev: 'Zvláštní váhy',    rozsireni: true, obtiznost: 'těžké' },
  { id: 'e10', nazev: 'Bez vah',          rozsireni: true, obtiznost: 'těžké' }
];

/* Pole úloh. Společné klíče:
   id, etapa, obtiznost, typ (pokus ; veta ; res ; zapis ; zvlastni),
   leva, prava (pozice p, typ t, počet n), x (skrytá hmotnost L),
   opora (ukazka ; spolu ; sam), zasobnik (povolená závaží), zamceno (nejde stavět).
   brana: true = samostatná úloha, která rozhoduje o konci etapy.
   vzor = podle čeho se generují dvojčata. */
var ULOHY = [
  /* ---------- E1 Háček ---------- */
  { id: 'e1a', etapa: 'e1', obtiznost: 'základní', typ: 'pokus', opora: 'spolu', x: 4,
    leva: [{ p: 1, t: 'L', n: 1 }, { p: 5, t: 'd', n: 1 }],
    prava: [{ p: 2, t: 'L', n: 1 }, { p: 1, t: 'd', n: 1 }],
    zasobnik: ['d'],
    text: 'Váhy stojí rovně. Na obě strany přidáš disk na pozici 2. Tipni, co udělají váhy. Pak disky přidej a váhy pusť.',
    cil: { pridej: { leva: [{ p: 2, t: 'd', n: 1 }], prava: [{ p: 2, t: 'd', n: 1 }] } },
    nesplneno: 'Úkol chce disk na pozici 2 vlevo i vpravo. Co na vahách ještě chybí?',
    napovedy: ['Jaký účinek má disk na pozici 2?',
               'O kolik se změní účinek vlevo? O kolik vpravo?',
               'Klikni na disk v zásobníku a potom na kolík 2 vlevo. Co uděláš vpravo?'] },
  { id: 'e1b', etapa: 'e1', obtiznost: 'základní', typ: 'pokus', opora: 'spolu', x: 4,
    leva: [{ p: 1, t: 'L', n: 1 }, { p: 5, t: 'd', n: 1 }],
    prava: [{ p: 2, t: 'L', n: 1 }, { p: 1, t: 'd', n: 1 }],
    zasobnik: ['d'],
    text: 'Váhy jsou zpět na začátku. Teď přidej disk na pozici 2 jen vlevo. Tipni a pusť váhy.',
    cil: { pridej: { leva: [{ p: 2, t: 'd', n: 1 }], prava: [] } },
    nesplneno: 'Úkol chce jeden disk na pozici 2 jen vlevo. Co je na vahách jinak?',
    napovedy: ['Která strana dostane účinek navíc?',
               'O kolik bude levá strana těžší než pravá?'] },
  { id: 'e1c', etapa: 'e1', obtiznost: 'základní', typ: 'veta', opora: 'spolu', x: 4,
    leva: [{ p: 1, t: 'L', n: 1 }, { p: 5, t: 'd', n: 1 }],
    prava: [{ p: 2, t: 'L', n: 1 }, { p: 1, t: 'd', n: 1 }],
    zasobnik: ['d', 't', 'h'],
    text: 'Doplň větu. Když si nejsi jistý(á), zkus to znovu na vahách.',
    veta: 'Když na obě strany přidám stejný účinek, váhy …',
    moznosti: ['klesnou vlevo', 'zůstanou rovně', 'klesnou vpravo'], spravne: 1,
    poSpatne: 'Přidej na obě strany stejný účinek a pusť váhy. Co udělaly?',
    napovedy: ['Co udělaly váhy v prvním pokusu, když jsi přidal(a) disk vlevo i vpravo?',
               'Přidej na obě strany stejný účinek a pusť váhy. Co udělaly?'] },

  /* ---------- E2 Účinek ---------- */
  { id: 'e2a', etapa: 'e2', obtiznost: 'základní', typ: 'pokus', opora: 'sam', x: 1, zamceno: true, ucinky: true,

/* =====================================================================
   MODEL: čisté funkce, žádný přístup k dokumentu
   Strana vah = pole závaží { p: pozice, t: typ }. Váhy = { L: [], R: [] }.
   ===================================================================== */
var M = {};

M.rozbal = function (def) {
  var s = [];
  (def || []).forEach(function (z) { for (var i = 0; i < (z.n || 1); i++) s.push({ p: z.p, t: z.t }); });
  return s;
};
M.kopie = function (v) { return { L: M.rozbal(v.L), R: M.rozbal(v.R) }; };

/* Strana jako a · x + b (celá čísla). */
M.koef = function (strana) {
  var a = 0, b = 0;
  strana.forEach(function (z) { if (z.t === 'L') a += z.p; else b += z.p * KONF.hmotnosti[z.t]; });
  return { a: a, b: b };
};
M.ucinek = function (strana, x) { var k = M.koef(strana); return k.a * x + k.b; };
/* −1 klesne levá ; 0 rovnováha ; 1 klesne pravá. Přesně, bez tolerance. */
M.naklon = function (vahy, x) {
  var l = M.ucinek(vahy.L, x), r = M.ucinek(vahy.R, x);
  return r > l ? 1 : (r < l ? -1 : 0);
};
M.naKoliku = function (strana, p) { return strana.filter(function (z) { return z.p === p; }).length; };
M.podpis = function (strana) {
  return strana.map(function (z) { return z.p + z.t; }).sort().join(' ');
};
M.stejne = function (s1, s2) { return M.podpis(s1) === M.podpis(s2); };
M.rovVah = function (vahy) { return { l: M.koef(vahy.L), r: M.koef(vahy.R) }; };

/* Nejmenší počet známých závaží s daným účinkem. */
M.MINCE = (function () {
  var m = [];
  ['d', 't', 'h'].forEach(function (t) {
    for (var p = KONF.maxPozice; p >= 1; p--) m.push({ p: p, t: t, v: p * KONF.hmotnosti[t] });
  });
  return m;
})();
M.rozmen = function (v) {
  if (v < 0 || v > 150 || v !== Math.floor(v)) return null;
  var best = [0], vol = [null], i, j;
  for (i = 1; i <= v; i++) {
    best[i] = Infinity;
    for (j = 0; j < M.MINCE.length; j++) {
      var m = M.MINCE[j];
      if (m.v <= i && best[i - m.v] + 1 < best[i]) { best[i] = best[i - m.v] + 1; vol[i] = m; }
    }
  }
  if (!isFinite(best[v])) return null;
  var out = [], r = v;
  while (r > 0) { out.push({ p: vol[r].p, t: vol[r].t }); r -= vol[r].v; }
  return out;
};

/* Přehledné rozmístění pro a · x + b. Vrací stranu, nebo null. */
M.rozmisti = function (a, b, zapor) {
  if (a !== Math.floor(a) || b !== Math.floor(b)) return null;
  if ((a < 0 || b < 0) && !zapor) return null;
  var s = [], cnt = {}, ok = true;
  function dej(p, t) {
    cnt[p] = (cnt[p] || 0) + 1;
    if (cnt[p] > KONF.maxNaKoliku) ok = false;
    s.push({ p: p, t: t });
  }
  var sa = a < 0 ? -1 : 1, ra = Math.abs(a);
  while (ra > 0) { var p = Math.min(KONF.maxPozice, ra); dej(sa * p, 'L'); ra -= p; }
  var sb = b < 0 ? -1 : 1, kusy = M.rozmen(Math.abs(b));
  if (!kusy) return null;
  kusy.forEach(function (k) { dej(sb * k.p, k.t); });
  return ok ? s : null;
};

/* Úprava strany o da · x + db s co nejmenší změnou závaží. */
M.aplikuj = function (strana, da, db, zapor) {
  var s = M.rozbal(strana), max = KONF.maxNaKoliku, i, k;
  function nouze() { var c = M.koef(strana); return M.rozmisti(c.a + da, c.b + db, zapor); }
  function najdi(test, lepsi) {
    var b = -1;
    s.forEach(function (z, j) { if (test(z) && (b < 0 || lepsi(z, s[b]))) b = j; });
    return b;
  }
  /* neznámá */
  if (da < 0) {
    k = -da;
    while (k > 0) {
      i = najdi(function (z) { return z.t === 'L' && z.p > 0; }, function (z, y) { return z.p > y.p; });
      if (i < 0) return nouze();
      if (s[i].p <= k) { k -= s[i].p; s.splice(i, 1); }
      else if (M.naKoliku(s, s[i].p - k) < max) { s[i].p -= k; k = 0; }
      else return nouze();
    }
  } else if (da > 0) {
    k = da;
    while (k > 0) {
      i = najdi(function (z) { return z.t === 'L' && z.p < 0 && -z.p <= k; }, function (z, y) { return z.p < y.p; });
      if (i >= 0) { k += s[i].p; s.splice(i, 1); continue; }
      var p = Math.min(KONF.maxPozice, k);
      if (M.naKoliku(s, p) >= max) return nouze();
      s.push({ p: p, t: 'L' }); k -= p;
    }
  }
  /* známá závaží */
  function ef(z) { return z.p * KONF.hmotnosti[z.t]; }
  if (db !== 0) {
    var zn = db < 0 ? 1 : -1;      /* ubírám z kladných, nebo ze záporných kolíků */
    var c = Math.abs(db), bezpecne = 40;
    while (c > 0 && bezpecne-- > 0) {
      i = najdi(function (z) { return z.t !== 'L' && zn * ef(z) === c; }, function () { return false; });
      if (i >= 0) { s.splice(i, 1); c = 0; break; }
      i = najdi(function (z) { return z.t === 'd' && zn * z.p > c && M.naKoliku(s, z.p - zn * c) < max; },
                function (z, y) { return zn * z.p < zn * y.p; });
      if (i >= 0) { s[i].p -= zn * c; c = 0; break; }
      i = najdi(function (z) { return z.t !== 'L' && zn * ef(z) > 0 && zn * ef(z) < c; },
                function (z, y) { return zn * ef(z) > zn * ef(y); });
      if (i >= 0) { c -= zn * ef(s[i]); s.splice(i, 1); continue; }
      break;
    }
    if (c > 0) {                   /* zbytek přidám na opačné rameno */
      if (zn === 1 && !zapor) return nouze();
      var kusy = M.rozmen(c);
      if (!kusy) return nouze();
      for (i = 0; i < kusy.length; i++) {
        var pp = -zn * kusy[i].p;
        if (M.naKoliku(s, pp) >= max) return nouze();
        s.push({ p: pp, t: kusy[i].t });
      }
    }
  }
  var bylo = M.koef(strana), je = M.koef(s);
  return (je.a === bylo.a + da && je.b === bylo.b + db) ? s : nouze();
};

/* Jaký krok vede od rovnice z k rovnici n (celočíselné koeficienty). */
M.krok = function (z, n) {
  var dl = { a: n.l.a - z.l.a, b: n.l.b - z.l.b }, dr = { a: n.r.a - z.r.a, b: n.r.b - z.r.b };
  function nul(d) { return d.a === 0 && d.b === 0; }
  if (nul(dl) && nul(dr)) return { typ: 'nic' };
  if (dl.a === dr.a && dl.b === dr.b) return { typ: 'plus', d: dl };
  var nenul = function (r) { return r.l.a || r.l.b || r.r.a || r.r.b; };
  if (nenul(z) && nenul(n)) {
    for (var k = 2; k <= 12; k++) {
      if (n.l.a * k === z.l.a && n.l.b * k === z.l.b && n.r.a * k === z.r.a && n.r.b * k === z.r.b) return { typ: 'del', k: k };
      if (z.l.a * k === n.l.a && z.l.b * k === n.l.b && z.r.a * k === n.r.a && z.r.b * k === n.r.b) return { typ: 'nas', k: k };
    }
  }
  return { typ: 'ruzne', dl: dl, dr: dr };
};

/* V jaké situaci rovnice je a jaký krok se nabízí (čísla, ne zlomky). */
M.situace = function (r) {
  if (r.l.a !== 0 && r.r.a !== 0) {
    var mensi = r.l.a <= r.r.a ? r.l : r.r;
    return { typ: 'obe', k: mensi.a, c: mensi.b, vetsi: Math.max(r.l.a, r.r.a) };
  }
  var s = r.l.a !== 0 ? r.l : (r.r.a !== 0 ? r.r : null);
  if (!s) return { typ: 'bezx' };
  var o = s === r.l ? r.r : r.l;
  if (s.b !== 0) return { typ: s.b < 0 ? 'konstZap' : 'konst', c: s.b, a: s.a, o: o.b };
  if (s.a !== 1) return { typ: 'nasob', a: s.a, c: o.b };
  return { typ: 'hotovo', c: o.b };
};
M.izolovano = function (r) {
  return (r.l.a !== 0 && r.l.b === 0 && r.r.a === 0) || (r.r.a !== 0 && r.r.b === 0 && r.l.a === 0);
};

/* ---------- zlomky ---------- */
function nsd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
function Q(n, d) {
  if (d === undefined) d = 1;
  if (d < 0) { n = -n; d = -d; }
  var g = nsd(n, d);
  return { n: n / g, d: d / g };
}
Q.plus = function (p, q) { return Q(p.n * q.d + q.n * p.d, p.d * q.d); };
Q.minus = function (p, q) { return Q(p.n * q.d - q.n * p.d, p.d * q.d); };
Q.krat = function (p, q) { return Q(p.n * q.n, p.d * q.d); };
Q.deleno = function (p, q) { return Q(p.n * q.d, p.d * q.n); };
Q.rovno = function (p, q) { return p.n === q.n && p.d === q.d; };
Q.nula = function (p) { return p.n === 0; };
Q.abs = function (p) { return Q(Math.abs(p.n), p.d); };
Q.neg = function (p) { return Q(-p.n, p.d); };
Q.cislo = function (p) { return p.n / p.d; };
M.Q = Q;
M.vyrazQ = function (e) { return { a: Q(e.a), b: Q(e.b) }; };
M.rovQ = function (r) { return { l: M.vyrazQ(r.l), r: M.vyrazQ(r.r) }; };
M.rovCisla = function (r) {
  return { l: { a: Q.cislo(r.l.a), b: Q.cislo(r.l.b) }, r: { a: Q.cislo(r.r.a), b: Q.cislo(r.r.b) } };
};
M.jeCela = function (r) { return r.l.a.d === 1 && r.l.b.d === 1 && r.r.a.d === 1 && r.r.b.d === 1; };

/* ---------- formát ---------- */
M.fmtQ = function (q) {
  var z = q.n < 0 ? '−' : '', n = Math.abs(q.n);
  if (q.d === 1) return z + n;
  var d = q.d, jen = d;
  while (jen % 2 === 0) jen /= 2;
  while (jen % 5 === 0) jen /= 5;
  if (jen === 1 && d <= 100) return z + String(n / d).replace('.', ',');
  return z + n + '/' + d;
};
M.fmtCislo = function (c) {
  if (typeof c === 'number') c = Q(Math.round(c * 1000), 1000);
  return M.fmtQ(c);
};

/* ---------- parser lineárních výrazů v x ---------- */
M.cti = function (text) {

    var v = cinitel();
    for (;;) {
      if (tok[i] === '·') { i++; v = krat(v, cinitel()); }
      else if (tok[i] === ':') {
        i++; var w = cinitel();

        v = { a: Q.deleno(v.a, w.b), b: Q.deleno(v.b, w.b) };

/* Úprava za čarou: −2x ; +4 ; : 3 ; · 2 */
M.ctiUpravu = function (text) {

M.pouzij = function (u, r) {

M.norm = function (r) { return { A: Q.minus(r.l.a, r.r.a), B: Q.minus(r.r.b, r.l.b) }; };

/* ---------- generátor dvojčat ---------- */

/* ---------- PDF: jedna stránka A4 = jeden obrázek JPEG, bez knihoven ---------- */
M.sestavPdf = function (obr) {

  function txt(s) { var a = new Uint8Array(s.length); for (var j = 0; j < s.length; j++) a[j] = s.charCodeAt(j) & 255; casti.push(a); delka += a.length; }

  var kids = [], proud = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  for (i = 0; i < obr.length; i++) kids.push((3 + i * 3) + ' 0 R');
  txt('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + obr.length + ' >>');
  obr.forEach(function (o, j) {
    var p = 3 + j * 3;
    obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + (p + 1) + ' 0 R >> >> /Contents ' + (p + 2) + ' 0 R >>');
    ofs[p + 1] = delka;
    txt((p + 1) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + o.w + ' /Height ' + o.h +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + o.bajty.length + ' >>\nstream\n');
    bin(o.bajty);
    txt('\nendstream\nendobj\n');
    obj(p + 2, '<< /Length ' + proud.length + ' >>\nstream\n' + proud + '\nendstream');
  });
  var pocet = 3 + obr.length * 3, xref = delka;
  txt('xref\n0 ' + pocet + '\n0000000000 65535 f \n');
  for (i = 1; i < pocet; i++) txt(('0000000000' + ofs[i]).slice(-10) + ' 00000 n \n');
  txt('trailer\n<< /Size ' + pocet + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');

  casti.forEach(function (a) { out.set(a, poz); poz += a.length; });

};
M.nazevSouboru = function (jmeno) {

  s = s.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

};

/* ---------- vestavěné testy (adresa s ?test=1) ---------- */
M.testy = function () {
  var ok = 0, chyby = [];
  function t(nazev, podm) { if (podm) ok++; else chyby.push(nazev); }
  var r = M.rozbal;
  /* účinek a náklon */
  t('účinek disku na 4', M.ucinek(r([{ p: 4, t: 'd' }]), 1) === 4);
  t('účinek trojúhelníku na 3', M.ucinek(r([{ p: 3, t: 't' }]), 1) === 9);
  t('účinek L na 3', M.ucinek(r([{ p: 3, t: 'L' }]), 4) === 12);
  t('záporná pozice', M.ucinek(r([{ p: -4, t: 'd' }, { p: 2, t: 'L' }]), 5) === 6);
  var e1 = { L: r([{ p: 1, t: 'L' }, { p: 5, t: 'd' }]), R: r([{ p: 2, t: 'L' }, { p: 1, t: 'd' }]) };
  t('E1 rovnováha pro x = 4', M.naklon(e1, 4) === 0);
  t('E1 není rovnováha pro x = 3', M.naklon(e1, 3) !== 0);
  var e1o = M.kopie(e1); e1o.L.push({ p: 2, t: 'd' }); e1o.R.push({ p: 2, t: 'd' });
  t('E1 disk na 2 na obě strany nechá váhy rovně', M.naklon(e1o, 4) === 0);
  var e1l = M.kopie(e1); e1l.L.push({ p: 2, t: 'd' });
  t('E1 disk jen vlevo váhy nakloní vlevo', M.naklon(e1l, 4) === -1);
  /* koeficienty a rozmístění */
  for (var a = 0; a <= 8; a++) for (var b = 0; b <= 40; b++) {
    var s = M.rozmisti(a, b, false);
    if (!s) { t('rozmístění ' + a + 'x + ' + b, false); continue; }
    var k = M.koef(s), plno = false;
    for (var p = 1; p <= 5; p++) if (M.naKoliku(s, p) > KONF.maxNaKoliku) plno = true;
    t('rozmístění ' + a + 'x + ' + b, k.a === a && k.b === b && !plno);
  }
  t('rozmístění záporné', (function () { var q = M.koef(M.rozmisti(2, -4, true)); return q.a === 2 && q.b === -4; })());
  t('rozmístění bez záporného ramene odmítne', M.rozmisti(1, -1, false) === null);
  /* úprava strany */
  var u = M.aplikuj(e1.R, -1, 0, false);
  t('ubrat x: L z 2 na 1', M.podpis(u) === '1L 1d');
  u = M.aplikuj(r([{ p: 5, t: 'd' }]), 0, -1, false);
  t('ubrat 1: disk z 5 na 4', M.podpis(u) === '4d');
  u = M.aplikuj(r([{ p: 2, t: 'L' }, { p: -4, t: 'd' }]), 0, 4, true);
  t('přidat 4 zruší disk na −4', M.podpis(u) === '2L');
  for (a = 1; a <= 5; a++) for (b = 1; b <= 20; b++) for (var d = 1; d <= b; d++) {
    var puv = M.rozmisti(a, b, false), po = M.aplikuj(puv, 0, -d, false), kk = po && M.koef(po);
    t('aplikuj ' + a + 'x+' + b + ' −' + d, !!po && kk.a === a && kk.b === b - d);
  }
  /* kroky */
  t('krok stejný', M.krok({ l: { a: 1, b: 5 }, r: { a: 2, b: 1 } }, { l: { a: 0, b: 5 }, r: { a: 1, b: 1 } }).typ === 'plus');
  t('krok dělení', M.krok({ l: { a: 2, b: 0 }, r: { a: 0, b: 8 } }, { l: { a: 1, b: 0 }, r: { a: 0, b: 4 } }).k === 2);
  t('krok různý', M.krok({ l: { a: 1, b: 5 }, r: { a: 2, b: 1 } }, { l: { a: 1, b: 6 }, r: { a: 2, b: 1 } }).typ === 'ruzne');
  /* parser */
  function ek(x, y) { return M.ekviv(M.ctiRovnici(x), M.ctiRovnici(y)); }
  var v = M.cti('2x + 3');
  t('parser 2x + 3', v.a.n === 2 && v.b.n === 3);
  v = M.cti('3 + 2·x'); t('parser jiné pořadí', v.a.n === 2 && v.b.n === 3);
  v = M.cti('2*x-3'); t('parser hvězdička a minus', v.a.n === 2 && v.b.n === -3);
  v = M.cti('4 · (x − 3)'); t('parser závorka', v.a.n === 4 && v.b.n === -12);

  t('parser odmítne x · x', (function () { try { M.cti('x·x'); return false; } catch (e) { return true; } })());
  t('parser odmítne nesmysl', M.ctiRovnici('2x + = 3') === null && M.ctiRovnici('abc') === null);
  t('ekvivalence přeskočený krok', ek('x + 5 = 2x + 1', '4 = x'));
  t('ekvivalence násobek', ek('2x = 8', 'x = 4'));
  t('neekvivalence', !ek('x + 5 = 2x + 1', 'x = 5'));
  t('a + 2 není 2a', !ek('x + 2 = 8', '2x = 8'));
